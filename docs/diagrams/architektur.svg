<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>PraxisTermin – Architekturdiagramm (Systemlandschaft von den Nutzer:innen bis zur CI/CD-Pipeline)</title>
  <defs>
    <marker id="arrow-rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F7A8C"/>
    </marker>
    <marker id="arrow-sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E8A6B"/>
    </marker>
    <marker id="arrow-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/>
    </marker>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font-size: 26px; font-weight: 700; fill: #1F4E5F; }
      .subtitle { font-size: 14px; fill: #7A7570; }
      .zone { fill: #F7F5F2; stroke: #DDD8D1; stroke-width: 1.5; }
      .zone-title { font-size: 14px; font-weight: 700; fill: #4A4642; letter-spacing: 0.4px; }
      .ns { fill: #DCEDF0; fill-opacity: 0.45; stroke: #2F7A8C; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .ns-title { font-size: 13px; font-weight: 700; fill: #1F4E5F; }
      .comp { fill: #FFFFFF; stroke: #1F4E5F; stroke-width: 1.5; }
      .comp-title { font-size: 13.5px; font-weight: 700; fill: #1F4E5F; }
      .comp-text { font-size: 11.5px; fill: #4A4642; }
      .actor { fill: #FFFFFF; stroke: #7A7570; stroke-width: 1.5; }
      .actor-title { font-size: 13.5px; font-weight: 600; fill: #1E1C1A; }
      .chip { fill: #FFFFFF; stroke: #5E8A6B; stroke-width: 1.3; }
      .chip-num { font-size: 11px; font-weight: 700; fill: #5E8A6B; }
      .chip-title { font-size: 11.5px; font-weight: 700; fill: #1E1C1A; }
      .chip-text { font-size: 10.5px; fill: #4A4642; }
      .flow-rt { stroke: #2F7A8C; stroke-width: 2; fill: none; marker-end: url(#arrow-rt); }
      .flow-sc { stroke: #5E8A6B; stroke-width: 2; fill: none; marker-end: url(#arrow-sc); }
      .flow-sec { stroke: #B7791F; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-sec); }
      .label { font-size: 11px; font-weight: 600; fill: #2F7A8C; }
      .label-sc { font-size: 11px; font-weight: 600; fill: #5E8A6B; }
      .label-sec { font-size: 11px; font-weight: 600; fill: #B7791F; }
      .note { font-size: 11px; fill: #7A7570; }
      .legend-text { font-size: 12px; fill: #4A4642; }
      .footer { font-size: 12px; fill: #7A7570; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1040"/>

  <!-- Titel -->
  <text class="title" x="40" y="50">PraxisTermin – Architektur der Systemlandschaft</text>
  <text class="subtitle" x="40" y="74">Terminbuchungssystem Ärztehaus Lindle · Nutzer:innen → Kubernetes-Cluster (kind) → Container-Registry → CI/CD-Pipeline → Entwickler-Workstation</text>

  <!-- ===================== Zone A: Nutzer:innen ===================== -->
  <rect class="zone" x="40" y="110" width="240" height="430" rx="16"/>
  <text class="zone-title" x="56" y="138">NUTZER:INNEN (UNTRUSTED)</text>

  <rect class="actor" x="60" y="160" width="200" height="56" rx="10"/>
  <text class="actor-title" x="76" y="184">Patient:in</text>
  <text class="comp-text" x="76" y="202">Registrierung, Buchung · MFA optional</text>

  <rect class="actor" x="60" y="232" width="200" height="56" rx="10"/>
  <text class="actor-title" x="76" y="256">Praxispersonal (STAFF)</text>
  <text class="comp-text" x="76" y="274">Terminverwaltung · MFA Pflicht</text>

  <rect class="actor" x="60" y="304" width="200" height="56" rx="10"/>
  <text class="actor-title" x="76" y="328">Ärzt:in (DOCTOR)</text>
  <text class="comp-text" x="76" y="346">Tagesplan, Status · MFA Pflicht</text>

  <rect class="actor" x="60" y="376" width="200" height="56" rx="10"/>
  <text class="actor-title" x="76" y="400">Admin</text>
  <text class="comp-text" x="76" y="418">Nutzer, Rollen, Audit · MFA Pflicht</text>

  <rect class="comp" x="60" y="462" width="200" height="56" rx="10"/>
  <text class="comp-title" x="76" y="486">Browser</text>
  <text class="comp-text" x="76" y="504">React-SPA, Cookie __Host-session</text>

  <!-- ===================== Zone B: Kubernetes-Cluster ===================== -->
  <rect class="zone" x="320" y="110" width="720" height="600" rx="16"/>
  <text class="zone-title" x="336" y="138">LOKALES KUBERNETES-CLUSTER (KIND) – IDENTISCH IM GITHUB-RUNNER UND AUF DEM LAPTOP</text>

  <!-- Namespace ingress-nginx -->
  <rect class="ns" x="340" y="400" width="200" height="190" rx="12"/>
  <text class="ns-title" x="352" y="422">Namespace ingress-nginx</text>
  <rect class="comp" x="352" y="434" width="176" height="140" rx="10"/>
  <text class="comp-title" x="364" y="456">Ingress-NGINX</text>
  <text class="comp-text" x="364" y="474">TLS-Terminierung (Secret tls-cert)</text>
  <text class="comp-text" x="364" y="490">HTTP → HTTPS Redirect, HSTS</text>
  <text class="comp-text" x="364" y="506">/      → frontend-svc :8080</text>
  <text class="comp-text" x="364" y="522">/api → backend-svc :8000</text>
  <text class="comp-text" x="364" y="538">Rate-Limit auf /api/v1/auth/*</text>
  <text class="comp-text" x="364" y="554">Body-Size-Limit 1 MiB</text>

  <!-- Namespace praxis-termine -->
  <rect class="ns" x="570" y="150" width="450" height="540" rx="12"/>
  <text class="ns-title" x="582" y="172">Namespace praxis-termine · NetworkPolicy default-deny (Ingress + Egress)</text>

  <!-- Frontend -->
  <rect class="comp" x="590" y="190" width="200" height="130" rx="10"/>
  <text class="comp-title" x="602" y="212">praxis-frontend</text>
  <text class="comp-text" x="602" y="230">Deployment · 1 Replica</text>
  <text class="comp-text" x="602" y="246">nginx-unprivileged :8080</text>
  <text class="comp-text" x="602" y="262">statische React-SPA</text>
  <text class="comp-text" x="602" y="278">CSP · nosniff · X-Frame DENY</text>
  <text class="comp-text" x="602" y="294">ServiceAccount frontend-sa</text>
  <text class="comp-text" x="602" y="310">Image: praxis-frontend@sha256:…</text>

  <!-- Secrets / ConfigMap -->
  <rect class="comp" x="810" y="190" width="190" height="130" rx="10" stroke="#B7791F"/>
  <text class="comp-title" x="822" y="212" fill="#B7791F">Secrets &amp; ConfigMap</text>
  <text class="comp-text" x="822" y="230">db-credentials</text>
  <text class="comp-text" x="822" y="246">app-session-key (AES-GCM)</text>
  <text class="comp-text" x="822" y="262">admin-bootstrap (Initial-PW)</text>
  <text class="comp-text" x="822" y="278">tls-cert (im ingress-nginx)</text>
  <text class="comp-text" x="822" y="294">ConfigMap app-config</text>
  <text class="comp-text" x="822" y="310" font-style="italic">erzeugt beim Deploy, nie im Repo</text>

  <!-- Backend -->
  <rect class="comp" x="590" y="400" width="200" height="160" rx="10"/>
  <text class="comp-title" x="602" y="422">praxis-backend</text>
  <text class="comp-text" x="602" y="440">Deployment · 1 Replica</text>
  <text class="comp-text" x="602" y="456">FastAPI · uvicorn :8000 · Py 3.12</text>
  <text class="comp-text" x="602" y="472">Init: alembic upgrade head</text>
  <text class="comp-text" x="602" y="488">Argon2id · Sessions · TOTP-MFA</text>
  <text class="comp-text" x="602" y="504">RBAC · Validierung · Audit-Log</text>
  <text class="comp-text" x="602" y="520">ServiceAccount backend-sa</text>
  <text class="comp-text" x="602" y="536">Probes /healthz /readyz</text>
  <text class="comp-text" x="602" y="552">Image: praxis-backend@sha256:…</text>

  <!-- Postgres -->
  <rect class="comp" x="810" y="400" width="190" height="160" rx="10"/>
  <text class="comp-title" x="822" y="422">praxis-postgres</text>
  <text class="comp-text" x="822" y="440">StatefulSet · 1 Replica</text>
  <text class="comp-text" x="822" y="456">PostgreSQL 16 :5432</text>
  <text class="comp-text" x="822" y="472">PVC 1 Gi</text>
  <text class="comp-text" x="822" y="488">DB-Rollen: praxis_migrate (DDL)</text>
  <text class="comp-text" x="822" y="504">                   praxis_app (DML)</text>
  <text class="comp-text" x="822" y="520">nur von backend erreichbar</text>
  <text class="comp-text" x="822" y="536">ServiceAccount postgres-sa</text>
  <text class="comp-text" x="822" y="552">kein Ingress, kein Egress</text>

  <!-- Security footer -->
  <rect class="comp" x="590" y="580" width="410" height="96" rx="10" stroke="#7FA38A"/>
  <text class="comp-title" x="602" y="600" fill="#2E7D5B">Least Privilege (alle Pods)</text>
  <text class="comp-text" x="602" y="618">runAsNonRoot · readOnlyRootFilesystem · allowPrivilegeEscalation=false</text>
  <text class="comp-text" x="602" y="634">capabilities.drop [ALL] · seccompProfile RuntimeDefault · Requests/Limits</text>
  <text class="comp-text" x="602" y="650">ServiceAccounts ohne RBAC-Rechte, automountServiceAccountToken=false</text>
  <text class="comp-text" x="602" y="666">NetPol: ingress-nginx→frontend/backend · backend→postgres · Egress nur DNS</text>

  <!-- Ingress -> Frontend -->
  <path class="flow-rt" d="M530,462 L556,462 L556,255 L588,255"/>
  <text class="label" x="562" y="248">:8080  /</text>
  <!-- Ingress -> Backend -->
  <path class="flow-rt" d="M530,520 L556,520 L556,480 L588,480"/>
  <text class="label" x="561" y="512">:8000  /api</text>
  <!-- Backend -> Postgres -->
  <path class="flow-rt" d="M792,480 L808,480"/>
  <text class="label" x="782" y="470">:5432</text>
  <!-- Secrets -> Backend / Postgres -->
  <path class="flow-sec" d="M860,322 L860,360 L690,360 L690,398"/>
  <path class="flow-sec" d="M950,322 L950,398"/>
  <text class="label-sec" x="700" y="356">env / volume</text>

  <!-- Browser -> Ingress -->
  <path class="flow-rt" d="M262,490 L350,490"/>
  <text class="label" x="268" y="482">HTTPS :443</text>

  <!-- GHCR -> Cluster -->
  <path class="flow-sc" d="M1098,640 L1042,640"/>

  <!-- ===================== Zone C: Lieferkette ===================== -->
  <rect class="zone" x="1080" y="110" width="480" height="600" rx="16"/>
  <text class="zone-title" x="1096" y="138">LIEFERKETTE (GITHUB)</text>

  <rect class="comp" x="1100" y="150" width="440" height="56" rx="10"/>
  <text class="comp-title" x="1112" y="172">Entwickler:innen · Manuel, Laszlo</text>
  <text class="comp-text" x="1112" y="190">Feature-Branch → PR (Scans) → Review → Merge in main · GitHub Desktop</text>

  <path class="flow-sc" d="M1320,208 L1320,228"/>

  <rect class="comp" x="1100" y="230" width="440" height="56" rx="10"/>
  <text class="comp-title" x="1112" y="252">GitHub Repository (privat, Dozent als Maintainer)</text>
  <text class="comp-text" x="1112" y="270">main geschützt (PR + grüne Checks) · Code, Manifeste, Pipeline, evidence/</text>

  <path class="flow-sc" d="M1320,288 L1320,308"/>

  <!-- Pipeline -->
  <rect class="ns" x="1100" y="310" width="440" height="276" rx="12" stroke="#5E8A6B" fill="#E6EFE8"/>
  <text class="ns-title" x="1112" y="332" fill="#2E7D5B">GitHub Actions – Pipeline (Trigger: Push auf main)</text>

  <!-- Chips: 2 Spalten x 5 Reihen -->
  <rect class="chip" x="1112" y="342" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1120" y="357">1</text>
  <text class="chip-title" x="1132" y="357">SBOM</text>
  <text class="chip-text" x="1132" y="372">Syft → CycloneDX (Quelle + Image)</text>

  <rect class="chip" x="1326" y="342" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1334" y="357">2</text>
  <text class="chip-title" x="1346" y="357">SAST</text>
  <text class="chip-text" x="1346" y="372">Semgrep (SARIF), Bandit</text>

  <rect class="chip" x="1112" y="386" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1120" y="401">3</text>
  <text class="chip-title" x="1132" y="401">SCA</text>
  <text class="chip-text" x="1132" y="416">Trivy fs, pip-audit, npm audit</text>

  <rect class="chip" x="1326" y="386" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1334" y="401">4</text>
  <text class="chip-title" x="1346" y="401">Secret-Scan</text>
  <text class="chip-text" x="1346" y="416">Gitleaks, gesamte Historie</text>

  <rect class="chip" x="1112" y="430" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1120" y="445">5</text>
  <text class="chip-title" x="1132" y="445">Build + Tests</text>
  <text class="chip-text" x="1132" y="460">pytest, vitest, npm run build</text>

  <rect class="chip" x="1326" y="430" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1334" y="445">6</text>
  <text class="chip-title" x="1346" y="445">Container-Build</text>
  <text class="chip-text" x="1346" y="460">Buildx · Multi-Stage · Digest-Pins</text>

  <rect class="chip" x="1112" y="474" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1120" y="489">7</text>
  <text class="chip-title" x="1132" y="489">Image-Scan + Image-SBOM</text>
  <text class="chip-text" x="1132" y="504">Trivy image, Syft</text>

  <rect class="chip" x="1326" y="474" width="206" height="38" rx="8" stroke="#C0392B"/>
  <text class="chip-num" x="1334" y="489" fill="#C0392B">8</text>
  <text class="chip-title" x="1346" y="489">Quality Gate</text>
  <text class="chip-text" x="1346" y="504">0 Secrets · 0 HIGH/CRITICAL (CVSS≥7)</text>

  <rect class="chip" x="1112" y="518" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1120" y="533">9</text>
  <text class="chip-title" x="1132" y="533">Push → GHCR</text>
  <text class="chip-text" x="1132" y="548">Tag + Digest · cosign (Bonus)</text>

  <rect class="chip" x="1326" y="518" width="206" height="38" rx="8"/>
  <text class="chip-num" x="1334" y="533">10</text>
  <text class="chip-title" x="1350" y="533">Deploy-Test</text>
  <text class="chip-text" x="1350" y="548">kind im Runner · @digest · Smoke</text>

  <text class="comp-text" x="1112" y="574">Evidence: Reports + Run-Logs → Artefakte + Commit nach evidence/&lt;image&gt;/*</text>

  <path class="flow-sc" d="M1320,588 L1320,608"/>
  <text class="label-sc" x="1330" y="602">push (nur wenn Gate grün)</text>

  <!-- GHCR -->
  <rect class="comp" x="1100" y="610" width="440" height="76" rx="10" stroke="#5E8A6B"/>
  <text class="comp-title" x="1112" y="632" fill="#2E7D5B">Container-Registry · GHCR (Zwischeninstanz)</text>
  <text class="comp-text" x="1112" y="650">ghcr.io/&lt;org&gt;/praxis-backend@sha256:… · …/praxis-frontend@sha256:…</text>
  <text class="comp-text" x="1112" y="666">Pull nur per Digest: Deploy-Test im Runner und make up lokal</text>
  <text class="label-sc" x="1046" y="632">pull @digest</text>

  <!-- ===================== Zone D: Workstation ===================== -->
  <rect class="zone" x="320" y="750" width="720" height="130" rx="16"/>
  <text class="zone-title" x="336" y="778">ENTWICKLER-WORKSTATION (WINDOWS / MACOS) – REPRODUZIERBARKEIT</text>
  <rect class="comp" x="340" y="792" width="680" height="72" rx="10"/>
  <text class="comp-title" x="352" y="814">make up</text>
  <text class="comp-text" x="352" y="832">kind create cluster → ingress-nginx → Namespace + Secrets → Image laden (GHCR @digest oder lokaler Build + kind load)</text>
  <text class="comp-text" x="352" y="848">→ kustomize apply overlays/local → rollout status → Smoke-Test https://localhost → „Ready“ · make down · smoke · bundle</text>

  <path class="flow-sc" d="M680,750 L680,712"/>
  <text class="label-sc" x="690" y="738">erzeugt &amp; deployt</text>

  <!-- ===================== Legende ===================== -->
  <rect class="zone" x="1080" y="750" width="480" height="130" rx="16"/>
  <text class="zone-title" x="1096" y="778">LEGENDE</text>
  <line x1="1100" y1="800" x2="1150" y2="800" class="flow-rt"/>
  <text class="legend-text" x="1160" y="804">Laufzeit-Datenfluss (nur erlaubte Verbindungen)</text>
  <line x1="1100" y1="824" x2="1150" y2="824" class="flow-sc"/>
  <text class="legend-text" x="1160" y="828">Lieferkette / Deployment</text>
  <line x1="1100" y1="848" x2="1150" y2="848" class="flow-sec"/>
  <text class="legend-text" x="1160" y="852">Bereitstellung von Secrets (env / volume)</text>
  <rect x="1100" y="862" width="50" height="12" class="ns"/>
  <text class="legend-text" x="1160" y="873">Namespace mit NetworkPolicy · Vertrauensgrenzen im DFD detailliert</text>

  <!-- Footer -->
  <text class="footer" x="40" y="1010">PraxisTermin · Architekturdiagramm v0.1.0 · 02.10.2026 · Manuel Sposato, Laszlo · Security by Design STG-TINF24F</text>
</svg>
