# SPA-Auslieferung über nginx-unprivileged (Paket L3, SR-10 c)
#
# TODO(M6/M7): Es gibt noch kein Frontend-Image. Bis frontend/Dockerfile existiert, setzt das
# Makefile für den logischen Namen "praxis-frontend" das unveränderte Basis-Image
# nginxinc/nginx-unprivileged ein (Platzhalter: nginx-Startseite, noch ohne CSP/Header aus
# M7). Das echte Image baut auf demselben Basis-Image auf, Port, UID und Schreibpfade
# bleiben gleich; dann nur noch Makefile-Variable FRONTEND_PLACEHOLDER entfernen.
#
# Das Frontend erhält keinerlei Secrets und keine ConfigMap.
apiVersion: v1
kind: Service
metadata:
  name: praxis-frontend
  labels:
    app.kubernetes.io/name: praxis-frontend
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: praxis-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-frontend
  labels:
    app.kubernetes.io/name: praxis-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # Nutzer nginx im Image nginx-unprivileged
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: praxis-frontend
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            # nginx-unprivileged legt PID-Datei und alle Temp-Verzeichnisse unter /tmp ab.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
