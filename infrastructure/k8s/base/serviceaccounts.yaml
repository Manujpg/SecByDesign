# Identitäten der Pods (Paket L2, SR-10 b)
#
# Je Komponente ein eigener ServiceAccount. Es gibt bewusst keine Role/RoleBinding:
# Keiner der Pods braucht die Kubernetes-API. Das Token wird nicht eingehängt, ein
# kompromittierter Container hat damit keine Zugangsdaten für den API-Server.
# Nachweis: make check-k8s (kubectl auth can-i ... = no).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  labels:
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  labels:
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  labels:
    app.kubernetes.io/component: database
automountServiceAccountToken: false
---
# Den automatisch angelegten "default"-Account ebenfalls entschärfen, falls ein Pod
# versehentlich ohne serviceAccountName startet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
