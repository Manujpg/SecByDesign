# Plattform-Manifeste (gemeinsam für die Overlays local und ci)
#
# Stand: L1 (Gateway, Routen) und L2 (Namespace, Identitäten, Kontingente); "make infra"
# wendet nur diese an. ConfigMap, Workloads und Services (L3/L5) liegen in ../workloads.
# Es folgen L4 (NetworkPolicies).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: praxis-termine
labels:
  # Nicht in Selektoren, damit spätere Änderungen keine Deployments neu anlegen.
  - pairs:
      app.kubernetes.io/part-of: praxis-termine
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - resource-quota.yaml
  - limit-range.yaml
  - gateway.yaml
  - routes.yaml
