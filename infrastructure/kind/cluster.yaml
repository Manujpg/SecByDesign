# kind-Cluster für PraxisTermin (Paket L1, ADR A26)
#
#   kind create cluster --config infrastructure/kind/cluster.yaml   (bzw. make cluster)
#
# Ein Node (Control Plane + Workloads) reicht für Einzelreplicas lokal und im CI-Runner.
# Der Envoy-Proxy des Gateways läuft als Service vom Typ NodePort mit festen Ports
# (infrastructure/gateway/envoyproxy.yaml); kind reicht diese Ports an den Host durch:
#
#   Host 127.0.0.1:80  -> Node 30080 -> Envoy-Listener "http"  (nur Redirect auf HTTPS)
#   Host 127.0.0.1:443 -> Node 30443 -> Envoy-Listener "https" (TLS-Terminierung)
#
# NetworkPolicies setzt kind seit v0.24 ohne zusätzliches CNI durch
# (kube-network-policies), Voraussetzung für Paket L4.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: praxis-termine
networking:
  # Feste Netze, damit FORWARDED_ALLOW_IPS im Backend (Client-IP von Envoy) und
  # NetworkPolicies reproduzierbar auf dieselben Adressbereiche zeigen.
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    # Node-Image per Digest gepinnt (Release-Notes kind v0.33.0), Kubernetes 1.35.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      # Nur auf Loopback: die Anwendung ist nicht aus dem LAN erreichbar.
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
